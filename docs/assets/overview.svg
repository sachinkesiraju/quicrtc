<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-label="One QUIC connection from agent server to browser/client carries four independent streams: screen video, reasoning tokens, tool calls, and telemetry — each on its own QUIC stream so a burst on one cannot head-of-line block the others.">
  <defs>
    <marker id="quicrtc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .endpoint { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
      .conn-tube { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .endpoint-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #0f172a; font-weight: 600; }
      .conn-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #1d4ed8; font-weight: 700; letter-spacing: 0.3px; }
      .conn-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e40af; }
      .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
      .stream-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #0f172a; font-weight: 600; }
      .stream-class { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <!-- Endpoints -->
  <rect class="endpoint" x="20" y="40" width="140" height="240" rx="8" ry="8"/>
  <text class="endpoint-label" x="90" y="165" text-anchor="middle">Agent server</text>

  <rect class="endpoint" x="620" y="40" width="140" height="240" rx="8" ry="8"/>
  <text class="endpoint-label" x="690" y="165" text-anchor="middle">Browser / client</text>

  <!-- One QUIC connection envelope wrapping the four streams -->
  <rect class="conn-tube" x="170" y="40" width="440" height="240" rx="14" ry="14"/>
  <text class="conn-label" x="390" y="62" text-anchor="middle">ONE QUIC CONNECTION</text>

  <!-- Stream 1: screen video -->
  <line class="edge" x1="190" y1="105" x2="590" y2="105" marker-end="url(#quicrtc-arrow)"/>
  <text class="stream-name" x="185" y="100">screen video</text>
  <text class="stream-class" x="340" y="100">AU pipeline · prioritized · drop-old-on-burst</text>

  <!-- Stream 2: reasoning tokens -->
  <line class="edge" x1="190" y1="150" x2="590" y2="150" marker-end="url(#quicrtc-arrow)"/>
  <text class="stream-name" x="185" y="145">reasoning tokens</text>
  <text class="stream-class" x="340" y="145">uni stream · low-latency · ordered</text>

  <!-- Stream 3: tool calls -->
  <line class="edge" x1="190" y1="195" x2="590" y2="195" marker-end="url(#quicrtc-arrow)"/>
  <text class="stream-name" x="185" y="190">tool calls</text>
  <text class="stream-class" x="340" y="190">BidiPerCall · fresh stream per call · no HOL</text>

  <!-- Stream 4: telemetry -->
  <line class="edge" x1="190" y1="240" x2="590" y2="240" marker-end="url(#quicrtc-arrow)"/>
  <text class="stream-name" x="185" y="235">telemetry</text>
  <text class="stream-class" x="340" y="235">QUIC datagrams · unreliable · bypass FC</text>

  <!-- Connection sub-label -->
  <text class="conn-sub" x="390" y="270" text-anchor="middle">0-RTT resume · connection migration · per-stream flow control</text>
</svg>
