<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>webrtc browser receiver</title></head>
<body>
<h1 id="status">connecting…</h1>
<pre id="log"></pre>
<script>
// Browser-side WebRTC receiver. Uses native RTCPeerConnection.
// Signaling is done via plain HTTP POST to the orchestrator: we
// POST our offer, receive the answer, exchange ICE candidates via
// long-poll. Records arrival time of each data-channel message.

const params = new URLSearchParams(window.location.search);
const expect = parseInt(params.get("n") || "200", 10);
const sigURL = params.get("sig") || "/sig";
const reportURL = params.get("report") || "/report";
const status = document.getElementById("status");

async function main() {
  try {
    const pc = new RTCPeerConnection({iceServers: []});
    const recvTimes = [];
    const sentTimes = [];

    pc.ondatachannel = (ev) => {
      const dc = ev.channel;
      dc.binaryType = "arraybuffer";
      dc.onmessage = (m) => {
        const now = performance.now();
        const data = new Uint8Array(m.data);
        const dv = new DataView(data.buffer, data.byteOffset);
        sentTimes.push(Number(dv.getBigUint64(0, false)));
        recvTimes.push(now);
      };
    };

    pc.onicecandidate = async (ev) => {
      if (ev.candidate) {
        await fetch(sigURL + "?op=ice-from-browser", {
          method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify(ev.candidate.toJSON()),
        });
      }
    };

    // POST our offer-request: server creates offer, returns SDP.
    // We accept as remote, create answer, send it back.
    const offerResp = await fetch(sigURL + "?op=get-offer");
    const offer = await offerResp.json();
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await fetch(sigURL + "?op=answer", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify(answer),
    });

    // Long-poll for server's ICE candidates.
    (async () => {
      while (true) {
        const r = await fetch(sigURL + "?op=ice-from-server");
        if (r.status === 204) return;
        const c = await r.json();
        if (!c) return;
        try { await pc.addIceCandidate(c); } catch {}
      }
    })();

    status.textContent = "negotiating";
    while (recvTimes.length < expect) {
      await new Promise(r => setTimeout(r, 10));
    }
    status.textContent = `done (${recvTimes.length}/${expect})`;
    await fetch(reportURL, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({
        protocol: "webrtc",
        n: recvTimes.length,
        recvAtMs: recvTimes,
        sentAtNs: sentTimes,
        firstRecvMs: recvTimes[0],
        lastRecvMs: recvTimes[recvTimes.length - 1],
      }),
    });
  } catch (e) {
    status.textContent = "error: " + e.message;
    await fetch(reportURL, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({protocol: "webrtc", error: e.message || String(e)}),
    });
  }
}
main();
</script>
</body>
</html>
